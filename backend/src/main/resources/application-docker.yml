logging:
  level:
    org.springframework.boot.web.embedded.tomcat: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
  pattern:
    console: "🐳 DOCKER 🐳 - %d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080


spring:
  datasource:
    url: jdbc:mysql://${AIVEN_DB_HOST}:${AIVEN_DB_PORT}/${AIVEN_DB_NAME}?sslMode=${AIVEN_DB_SSL_MODE}&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${AIVEN_DB_USERNAME}
    password: ${AIVEN_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}
