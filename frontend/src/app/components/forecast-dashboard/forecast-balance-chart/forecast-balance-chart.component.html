<section class="panel chart-panel">
  <header class="panel-header">
    <div>
      <p class="panel-kicker">Balance Proyectado</p>
      <h2>Ingresos vs Gastos</h2>
      <p class="panel-copy">Comparativa entre lo que ya llevas acumulado y el cierre estimado del mes.</p>
    </div>
  </header>

  <div class="chart-wrapper">
    @if (chartData) {
      <canvas baseChart [type]="'bar'" [data]="chartData" [options]="chartOptions"> </canvas>
    } @else {
      <div class="empty-state">No hay datos de previsión disponibles.</div>
    }
  </div>

  <footer class="legend-hint">
    <span class="pill neutral">Mes anterior</span>
    <span class="pill positive">Actual real</span>
    <span class="pill projection">Previsión</span>
  </footer>

  <p class="legend-copy">La barra de previsión marca el posible cierre mensual.</p>
</section>
