<!-- Componente de Filtros Reutilizable -->
<div class="transaction-filters-container">

  <!-- Header del componente -->
  @if (showTitle) {
    <div class="filters-header">
      <h3 class="filters-title">
        🔍 <span>{{ title }}</span>
      </h3>
      @if (showClearButton) {
        <button
          (click)="onClearFilters()"
          class="clear-button">
          ✨ Limpiar Filtros
        </button>
      }
    </div>
  }

  <!-- Grid de filtros -->
  <div class="filters-grid">

    <!-- Búsqueda por texto -->
    @if (showSearch) {
      <div class="filter-field search-field">
        <label class="filter-label">{{ searchLabel }}</label>
        <input
          type="text"
          [(ngModel)]="filters.search"
          placeholder="Título, descripción..."
          class="filter-input"
          (input)="onSearchChange()"
          (keyup.enter)="onApplyFilters()"
          />
      </div>
    }

    <!-- Tipo de transacción -->
    @if (showType) {
      <div class="filter-field">
        <label class="filter-label">{{ typeLabel }}</label>
        <select
          [(ngModel)]="filters.type"
          (ngModelChange)="onTypeChange()"
          class="filter-select">
          <option value="">Todos</option>
          <option value="INCOME">Ingresos</option>
          <option value="EXPENSE">Gastos</option>
        </select>
      </div>
    }

    <!-- Categoría (solo si hay tipo seleccionado) -->
    @if (showCategory && filters.type) {
      <div class="filter-field">
        <label class="filter-label">{{ categoryLabel }}</label>
        <select
          [(ngModel)]="filters.categoryId"
          (ngModelChange)="onFilterChange()"
          [disabled]="loadingCategories"
          class="filter-select">
          <option value="">Todas las categorías</option>
          @if (loadingCategories) {
            <option disabled>Cargando...</option>
          }
          @for (category of categories; track category) {
            <option [value]="category.id.toString()">
              {{ category.icon }} {{ category.name }} {{category.id}}
            </option>
          }
        </select>
      </div>
    }

    <!-- Fecha desde -->
    @if (showDateRange) {
      <div class="filter-field">
        <label class="filter-label">{{ dateFromLabel }}</label>
        <input
          type="date"
          [(ngModel)]="filters.dateFrom"
          (ngModelChange)="onFilterChange()"
          class="filter-input"
          />
      </div>
    }

    <!-- Fecha hasta -->
    @if (showDateRange) {
      <div class="filter-field">
        <label class="filter-label">{{ dateToLabel }}</label>
        <input
          type="date"
          [(ngModel)]="filters.dateTo"
          (ngModelChange)="onFilterChange()"
          class="filter-input"
          />
      </div>
    }

    <!-- Importe mínimo -->
    @if (showAmountRange) {
      <div class="filter-field">
        <label class="filter-label">{{ minAmountLabel }}</label>
        <input
          type="number"
          [(ngModel)]="filters.minAmount"
          step="0.01"
          min="0"
          placeholder="0.00"
          (ngModelChange)="onFilterChange()"
          class="filter-input"
          />
      </div>
    }

    <!-- Importe máximo -->
    @if (showAmountRange) {
      <div class="filter-field">
        <label class="filter-label">{{ maxAmountLabel }}</label>
        <input
          type="number"
          [(ngModel)]="filters.maxAmount"
          step="0.01"
          min="0"
          placeholder="999.99"
          (ngModelChange)="onFilterChange()"
          class="filter-input"
          />
      </div>
    }

    <!-- Botón aplicar filtros -->
    @if (showApplyButton) {
      <div class="filter-field apply-button-field">
        <button
          (click)="onApplyFilters()"
          class="apply-button">
          🎯 Aplicar Filtros
        </button>
      </div>
    }

  </div>
</div>
