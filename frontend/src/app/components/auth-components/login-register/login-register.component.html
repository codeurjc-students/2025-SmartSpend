<div class="login-container">
  <div class="register-card" [class.is-submitting]="isSubmitting">

    <img src="assets/images/logoBlanco.svg" alt="Logo" class="auth-logo">
    <h2 class="form-title">Iniciar sesión</h2>
    <p class="auth-subtitle">Accede para ver tus movimientos y previsiones.</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="form-email"
          placeholder="correo@ejemplo.com"
          [disabled]="isSubmitting"
          required
          />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            class="form-control"
            placeholder="Tu contraseña"
            [disabled]="isSubmitting"
            required
            />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [disabled]="isSubmitting"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            @if (!showPassword) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.97 10.97 0 0 1 12 19C5 19 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94"></path>
                <path d="M9.9 4.24A10.93 10.93 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19"></path>
                <path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            }
          </button>
        </div>
      </div>

          <button class="btn btn-secondary auth-submit-btn" type="submit" [disabled]="isSubmitting || !loginForm.form.valid">
            @if (isSubmitting) {
              <span class="auth-submit-spinner" aria-hidden="true"></span>
              <span>Iniciando sesión...</span>
            } @else {
              <span>Entrar</span>
            }
          </button>

      @if (isSubmitting) {
        <div class="auth-loading-hint" aria-live="polite">
          Estamos comprobando tus credenciales...
        </div>
      }

      <div class="social-divider">
        <span>o continúa con</span>
      </div>

      <div class="google-btn-wrapper">
        <div id="google-signin-btn"></div>
      </div>

      @if (errorMessage) {
        <div class="error-message"> <!-- Clase de error consistente -->
          {{ errorMessage }}
        </div>
      }
    </form>

    <div class="register-link"> <!-- Enlace para ir a registro -->
      <p>¿No tienes cuenta? <a [routerLink]="['/register']">Regístrate</a></p>
    </div>
  </div>
</div>
