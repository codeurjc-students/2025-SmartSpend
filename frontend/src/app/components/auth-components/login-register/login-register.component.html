<div class="login-container">
  <div class="register-card" [class.is-submitting]="isSubmitting">

    <img src="assets/images/logoBlancoNuevo.svg" alt="Logo" class="auth-logo">
    <h2 class="form-title">Iniciar sesión</h2>
    <p class="auth-subtitle">Accede para ver tus movimientos y previsiones.</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="form-email"
          placeholder="correo@ejemplo.com"
          [disabled]="isSubmitting"
          required
          />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            class="form-control"
            placeholder="Tu contraseña"
            [disabled]="isSubmitting"
            required
            />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [disabled]="isSubmitting"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.title]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            @if (!showPassword) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.97 10.97 0 0 1 12 19C5 19 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94"></path>
                <path d="M9.9 4.24A10.93 10.93 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19"></path>
                <path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            }
          </button>
        </div>
      </div>

          <button class="btn btn-secondary auth-submit-btn" type="submit" [disabled]="isSubmitting || !loginForm.form.valid">
            @if (isSubmitting) {
              <span class="auth-submit-spinner" aria-hidden="true"></span>
              <span>Iniciando sesión...</span>
            } @else {
              <span>Entrar</span>
            }
          </button>

      @if (isSubmitting) {
        <div class="auth-loading-hint" aria-live="polite">
          Estamos comprobando tus credenciales...
        </div>
      }

      <div class="social-divider">
        <span>o continúa con</span>
      </div>

      <div class="google-btn-wrapper">
        <!-- Botón visual custom: no recibe eventos, es solo decorativo -->
        <div class="google-custom-btn" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continuar con Google
        </div>
        <!-- Iframe de Google: invisible pero encima, recibe todos los clicks -->
        <div id="google-signin-btn" class="google-btn-overlay"></div>
      </div>

      @if (errorMessage) {
        <div class="error-message"> <!-- Clase de error consistente -->
          {{ errorMessage }}
        </div>
      }
    </form>

    <div class="register-link"> <!-- Enlace para ir a registro -->
      <p>¿No tienes cuenta? <a [routerLink]="['/register']">Regístrate</a></p>
    </div>
  </div>
</div>
