services:
  app:
    image: ${DOCKER_HUB_USERNAME}/smartspend:dev 
    container_name: smartspend-app
    restart: always
    ports:
      - "443:443"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      # --- AIVEN ---
      SPRING_DATASOURCE_URL: jdbc:mysql://smart-spend-db-service-smart-spend-db.a.aivencloud.com:11099/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${AIVEN_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AIVEN_DB_PASSWORD}
      
      # --- SEGURIDAD ---
      JWT_SECRET: ${JWT_SECRET}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
